/**:
  ros__parameters:
    # -- system --
    traj_resample_dist: 0.1         # path resampling interval [m]
    use_steer_prediction: true      # FIX: was false — use prediction for smoother control at low speed
    use_delayed_initial_state: true

    # -- path smoothing --
    enable_path_smoothing: false
    path_filter_moving_ave_num: 25
    curvature_smoothing_num_traj: 15
    curvature_smoothing_num_ref_steer: 15

    # -- trajectory extending --
    extend_trajectory_for_end_yaw_control: false

    # -- mpc optimization --
    qp_solver_type: "osqp"
    mpc_prediction_horizon: 50
    mpc_prediction_dt: 0.1

    # FIX: at 0.3 m/s this was triggering a 16-second, 167-step horizon — MPC
    # could not respond to current position. Reduced to 1.5m so horizon stays at
    # 50 steps (5 seconds) which is appropriate for a 0.3 m/s vehicle.
    mpc_min_prediction_length: 1.5  # was 5.0 — caused 167-step horizon at 0.3 m/s

    mpc_weight_lat_error: 0.4
    mpc_weight_heading_error: 0.5
    mpc_weight_heading_error_squared_vel: 0.3
    mpc_weight_steering_input: 1.0
    mpc_weight_steering_input_squared_vel: 0.25
    mpc_weight_lat_jerk: 0.1
    mpc_weight_steer_rate: 0.0
    mpc_weight_steer_acc: 0.000001

    # FIX: low curvature weights were 10× weaker than normal weights.
    # mpc_low_curvature_thresh_curvature: 0.0 meant EVERYTHING was treated as
    # low curvature, so MPC used lat_error weight of 0.1 instead of 1.0 —
    # only 10% of the normal correction aggressiveness. Raised to match normal.
    mpc_low_curvature_weight_lat_error: 0.4
    mpc_low_curvature_weight_heading_error: 0.0
    mpc_low_curvature_weight_heading_error_squared_vel: 0.3
    mpc_low_curvature_weight_steering_input: 1.0
    mpc_low_curvature_weight_steering_input_squared_vel: 0.25
    mpc_low_curvature_weight_lat_jerk: 0.0
    mpc_low_curvature_weight_steer_rate: 0.0
    mpc_low_curvature_weight_steer_acc: 0.000001

    # FIX: was 0.0 — meaning ALL trajectory segments were treated as
    # low curvature (using the weaker 0.1 weight). Set to 0.02 so only
    # genuinely straight sections use low-curvature weights. Curves now
    # use the full 1.0 lat_error weight.
    mpc_low_curvature_thresh_curvature: 0.02  # was 0.0 — everything was low curvature

    mpc_weight_terminal_lat_error: 1.0
    mpc_weight_terminal_heading_error: 0.1
    mpc_zero_ff_steer_deg: 0.5
    mpc_acceleration_limit: 2.0
    mpc_velocity_time_constant: 0.3

    # -- vehicle model --
    vehicle_model_type: "kinematics"
    input_delay: 0.24
    vehicle_model_steer_tau: 0.27

    # FIX: velocity_list started at 10.0 m/s — far above our 0.3 m/s operating speed.
    # MPC extrapolated outside the table, giving unpredictable steer rate limits.
    # Added 0.3 m/s entry with a generous 80 deg/s limit so MPC can steer quickly
    # enough to track curves at low speed.
    steer_rate_lim_dps_list_by_curvature: [15.0, 12.0, 10.0]
    curvature_list_for_steer_rate_lim: [0.001, 0.01, 0.05]
    steer_rate_lim_dps_list_by_velocity: [80.0, 18.0, 14.0, 12.0, 10.0, 8.0]
    velocity_list_for_steer_rate_lim: [0.3, 1.0, 2.0, 5.0, 10.0, 20.0]

    # -- lowpass filter --
    steering_lpf_cutoff_hz: 1.0
    error_deriv_lpf_cutoff_hz: 5.0

    # stop state
    stop_state_entry_ego_speed: 0.05
    stop_state_entry_target_speed: 0.05
    converged_steer_rad: 0.1
    keep_steer_control_until_converged: true
    new_traj_duration_time: 1.0
    new_traj_end_dist: 0.3
    mpc_converged_threshold_rps: 0.01

    # steer offset
    steering_offset:
      enable_auto_steering_offset_removal: true
      steer_offset_filter_cutoff_hz: 0.3
      max_update_th: 0.01

    publish_debug_trajectories: true
